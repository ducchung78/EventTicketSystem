name: Selenium Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  selenium-test:
    runs-on: ubuntu-latest

    env:
      ConnectionStrings__EventTicketSystemDb: "Server=localhost,1433;Database=EventTicketSystemDb;User Id=sa;Password=TestPassword@123;TrustServerCertificate=True"
      ASPNETCORE_URLS: "http://localhost:5134"

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: TestPassword@123
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P TestPassword@123 -Q SELECT_1 -No"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Node dependencies
        run: npm install

      - name: Restore .NET packages
        run: dotnet restore src/EventTicketSystem.Web/

      - name: Build .NET app
        run: dotnet build src/EventTicketSystem.Web/ --no-restore --configuration Release

      - name: Wait for SQL Server to be ready
        run: |
          echo "Waiting for SQL Server on port 1433..."
          for i in $(seq 1 40); do
            if nc -z localhost 1433 2>/dev/null; then
              echo "Port open, waiting 5s..."
              sleep 5
              echo "SQL Server ready!"
              exit 0
            fi
            echo "Attempt $i/40, retrying in 3s..."
            sleep 3
          done
          echo "ERROR: SQL Server did not start"
          exit 1

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef
        continue-on-error: true

      - name: Run database migrations
        run: |
          dotnet ef database update             --project src/EventTicketSystem.Web/             --startup-project src/EventTicketSystem.Web/

      - name: Start app in background
        run: |
          dotnet run --project src/EventTicketSystem.Web/ --no-build --configuration Release             > /tmp/app.log 2>&1 &
          echo $! > /tmp/app.pid
          echo "App started (PID: $(cat /tmp/app.pid))"

      - name: Wait for app to be ready
        run: |
          echo "Waiting for app to start..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5134 > /dev/null 2>&1; then
              echo "App ready after $((i * 3)) seconds"
              exit 0
            fi
            echo "Attempt $i/30, retrying in 3s..."
            sleep 3
          done
          echo "ERROR: App did not start within 90 seconds"
          echo "=== App log ==="
          cat /tmp/app.log || echo "(no log file)"
          exit 1

      - name: Create test-results directory
        run: mkdir -p test-results

      - name: Run Selenium tests
        run: npm test
        continue-on-error: true

      - name: Create Jira issues for failed tests
        if: always()
